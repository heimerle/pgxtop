[package]
name = "pgxtop"
version = "0.1.0"
edition = "2021"
description = "A btop-style TUI for NVIDIA AI workstations"
license = "MIT"
repository = "https://github.com/pgxtop/pgxtop"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# System monitoring
sysinfo = "0.32"

# NVML bindings
nvml-wrapper = "0.12"

# Configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Time
chrono = { version = "0.4", features = ["clock"] }

# Collections
indexmap = "2"

# Math for graphs
num-traits = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1